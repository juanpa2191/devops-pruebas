name: Build & Package for Deploy

on:
  push:
    branches: [main]

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias de produccion
        run: npm ci --omit=dev

      - name: Armar el paquete de despliegue
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          ARTIFACT_NAME="taller-motos-api-${VERSION}-${SHORT_SHA}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          mkdir -p "dist/$ARTIFACT_NAME"
          cp -r src "dist/$ARTIFACT_NAME/src"
          cp package.json package-lock.json ecosystem.config.js "dist/$ARTIFACT_NAME/"
          cp -r node_modules "dist/$ARTIFACT_NAME/node_modules"

          tar -czf "dist/$ARTIFACT_NAME.tar.gz" -C dist "$ARTIFACT_NAME"

      - name: Verificar que el paquete arranca correctamente
        run: |
          mkdir -p /tmp/verificacion
          tar -xzf "dist/${{ steps.package.outputs.artifact_name }}.tar.gz" -C /tmp/verificacion
          SERVER_ENTRY="/tmp/verificacion/${{ steps.package.outputs.artifact_name }}/src/server.js" \
          SMOKE_TEST_PORT=4600 \
          node scripts/smoke-test.js

      - name: Publicar artefacto de despliegue
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/${{ steps.package.outputs.artifact_name }}.tar.gz
          retention-days: 30

  deploy:
    name: Deploy
    needs: package
    runs-on: ubuntu-latest
    environment: production
    env:
      ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Descargar el artefacto generado por Package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: dist

      - name: Cargar la clave SSH del VPS
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Confiar en el host del VPS (ssh-keyscan)
        run: |
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copiar el artefacto al VPS
        run: |
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" "dist/$ARTIFACT_NAME.tar.gz" "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Extraer, actualizar symlink y recargar con PM2
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "ARTIFACT_NAME='$ARTIFACT_NAME' DEPLOY_PATH='$DEPLOY_PATH' bash -s" < scripts/deploy-remote.sh
